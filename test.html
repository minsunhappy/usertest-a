<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>사용자 테스트 A — 진행</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
</head>
<body class="test-page">
<div class="progress-bar">
    <div class="progress-inner">
        <span id="progressText"></span>
        <span class="muted">🔊 소리를 켜고 시청해 주세요</span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
</div>
<div class="wrap" id="content"></div>

<script>
let state = JSON.parse(localStorage.getItem("ut_state") || "null");
if (!state || state.finished || state.version !== 2) { location.href = "index.html"; }

let manifest = null;

function saveState() { localStorage.setItem("ut_state", JSON.stringify(state)); }

function currentSet() {
    const setId = state.setOrder[state.cursor.setIdx];
    return manifest.sets.find(s => s.set_id === setId);
}

function setAnswers(setId) {
    if (!state.answers[setId]) state.answers[setId] = {};
    return state.answers[setId];
}

function renderProgress() {
    const n = state.setOrder.length;
    const stepsDone = state.cursor.setIdx * 2 + (state.cursor.stage === "videos" ? 1 : 0);
    document.getElementById("progressText").textContent =
        `세트 ${state.cursor.setIdx + 1} / ${n}` +
        (state.cursor.stage === "intent" ? " · 의도 확인" : "");
    document.getElementById("progressFill").style.width = `${(stepsDone / (n * 2)) * 100}%`;
}

// 세트마다: 의도만 보여주는 페이지 → 영상 4개 + 질문 페이지
function render() {
    if (state.cursor.stage !== "videos") state.cursor.stage = "intent";
    renderProgress();
    if (state.cursor.stage === "intent") renderIntentPage();
    else renderVideosPage();
}

function renderIntentPage() {
    const set = currentSet();
    const el = document.getElementById("content");
    el.innerHTML = `
    <div class="card intent-page">
        <h2>세트 ${state.cursor.setIdx + 1} / ${state.setOrder.length}</h2>
        <p>이번 세트의 <b>의도</b>입니다. 충분히 읽고 확인한 뒤 다음으로 넘어가 주세요.<br>
        다음 페이지의 하이라이트 4개를 모두 이 의도를 기준으로 평가하시면 됩니다.</p>
        <div class="intent-box intent-box-lg">
            <div class="intent-text"><span class="intent-label">의도:</span> “${set.intent_ko}”</div>
        </div>
        <div class="btn-row">
            <button class="btn btn-secondary" id="prevBtn">${state.cursor.setIdx > 0 ? "← 이전 세트" : "← 참가자 정보 수정"}</button>
            <button class="btn" id="toVideosBtn">확인했습니다 · 영상 보기 →</button>
        </div>
    </div>`;

    document.getElementById("toVideosBtn").addEventListener("click", () => {
        state.cursor.stage = "videos";
        saveState();
        window.scrollTo(0, 0);
        render();
    });
    document.getElementById("prevBtn").addEventListener("click", () => {
        if (state.cursor.setIdx === 0) { location.href = "index.html"; return; }
        state.cursor.setIdx -= 1;
        state.cursor.stage = "videos";   // 이전 세트의 영상/질문 페이지로
        saveState();
        window.scrollTo(0, 0);
        render();
    });
}

function renderVideosPage() {
    const set = currentSet();
    const answers = setAnswers(set.set_id);
    const fileKeys = state.conditionOrders[set.set_id];
    const el = document.getElementById("content");

    const blocks = fileKeys.map((fk, i) => {
        const a = answers[fk] || {};
        const qHtml = QUESTIONS.map(q => `
            <div class="question">
                <div class="q-head"><span class="q-title">${q.title}</span> ${q.text}</div>
                ${q.note ? `<div class="q-note">${q.note}</div>` : ""}
                <div class="scale ${(!REQUIRE_FULL_WATCH || a.watched) ? "" : "disabled"}" id="scale-${fk}-${q.key}">
                    ${[1,2,3,4,5,6,7].map(v => `
                        <label><input type="radio" name="${fk}-${q.key}" value="${v}" ${a[q.key] === v ? "checked" : ""}><span>${v}</span></label>
                    `).join("")}
                </div>
                <div class="scale-labels"><span>${q.low}</span><span>${q.mid}</span><span>${q.high}</span></div>
            </div>`).join("");
        return `
        <div class="card video-card" data-fk="${fk}">
            <h2>하이라이트 ${i + 1} / 4</h2>
            <div class="video-grid">
                <div class="video-col">
                    <video id="player-${fk}" src="data/${set.set_id}/${fk}.mp4" controls controlslist="nodownload noplaybackrate" disablepictureinpicture preload="metadata"></video>
                    <div class="video-note ${a.watched ? "done" : ""}" id="note-${fk}">
                        ${a.watched ? "✓ 시청 완료! 질문에 답해 주세요."
                          : REQUIRE_FULL_WATCH ? "▶ 영상을 처음부터 끝까지 시청하면 질문이 활성화됩니다. (앞으로 건너뛰기 불가)"
                          : "▶ 영상을 처음부터 끝까지 시청한 후 답변해 주세요."}
                    </div>
                </div>
                <div class="q-col">
                    <div class="intent-inline"><span class="intent-label">의도:</span> “${set.intent_ko}”</div>
                    ${qHtml}
                </div>
            </div>
        </div>`;
    }).join("");

    el.innerHTML = `
    <div class="card set-header">
        <h2>세트 ${state.cursor.setIdx + 1}</h2>
        <p class="muted">아래 <b>의도</b>를 기준으로 이 페이지의 하이라이트 4개를 평가해 주세요.</p>
        <div class="intent-box">
            <div class="intent-text"><span class="intent-label">의도:</span> “${set.intent_ko}”</div>
        </div>
    </div>
    ${blocks}
    <div class="btn-row">
        <button class="btn btn-secondary" id="prevBtn">← 의도 다시 보기</button>
        <button class="btn" id="nextBtn" disabled>${state.cursor.setIdx < state.setOrder.length - 1 ? "다음 세트 →" : "제출하고 완료하기"}</button>
    </div>
    <p class="center muted">4개 영상의 질문에 모두 답하면 다음으로 넘어갈 수 있습니다.</p>`;

    // per-video wiring
    for (const fk of fileKeys) {
        const video = document.getElementById(`player-${fk}`);
        const a = answers[fk] || (answers[fk] = {});
        let maxPlayed = 0;
        let watchStart = null;

        video.addEventListener("play", () => {
            watchStart = Date.now();
            // pause the other videos so audio doesn't overlap
            for (const other of fileKeys) {
                if (other !== fk) document.getElementById(`player-${other}`).pause();
            }
        });
        video.addEventListener("pause", () => {
            if (watchStart) {
                a.watch_seconds = (a.watch_seconds || 0) + (Date.now() - watchStart) / 1000;
                watchStart = null;
                saveState();
            }
        });
        video.addEventListener("timeupdate", () => {
            if (REQUIRE_FULL_WATCH && !a.watched && video.currentTime > maxPlayed + 1.0) {
                video.currentTime = maxPlayed; // block forward seeking until first full watch
            } else if (video.currentTime > maxPlayed) {
                maxPlayed = video.currentTime;
            }
        });
        video.addEventListener("ratechange", () => { if (video.playbackRate !== 1) video.playbackRate = 1; });
        video.addEventListener("ended", () => {
            if (watchStart) {
                a.watch_seconds = (a.watch_seconds || 0) + (Date.now() - watchStart) / 1000;
                watchStart = null;
            }
            a.watched = true;
            saveState();
            const note = document.getElementById(`note-${fk}`);
            note.textContent = "✓ 시청 완료! 아래 질문에 답해 주세요.";
            note.classList.add("done");
            QUESTIONS.forEach(q => document.getElementById(`scale-${fk}-${q.key}`).classList.remove("disabled"));
            checkComplete();
        });
    }

    const nextBtn = document.getElementById("nextBtn");
    function checkComplete() {
        const done = fileKeys.every(fk =>
            (!REQUIRE_FULL_WATCH || answers[fk]?.watched) &&
            QUESTIONS.every(q => document.querySelector(`input[name="${fk}-${q.key}"]:checked`))
        );
        nextBtn.disabled = !done;
    }
    // clicking a locked scale points back at the watch-first notice
    el.querySelectorAll(".scale").forEach(s => s.addEventListener("click", () => {
        if (!s.classList.contains("disabled")) return;
        const fk = s.id.split("-")[1];
        const note = document.getElementById(`note-${fk}`);
        note.classList.add("attention");
        note.scrollIntoView({ behavior: "smooth", block: "center" });
        setTimeout(() => note.classList.remove("attention"), 1600);
    }));
    el.querySelectorAll("input[type=radio]").forEach(r => r.addEventListener("change", e => {
        const [fk, qkey] = e.target.name.split("-");
        answers[fk][qkey] = parseInt(e.target.value);
        saveState();
        checkComplete();
    }));
    checkComplete();

    const prevBtn = document.getElementById("prevBtn");
    prevBtn.addEventListener("click", () => {
        pauseAll(fileKeys);
        state.cursor.stage = "intent";   // 이 세트의 의도 페이지로
        saveState();
        window.scrollTo(0, 0);
        render();
    });

    nextBtn.addEventListener("click", async () => {
        nextBtn.disabled = true;
        pauseAll(fileKeys);
        await uploadSet(set, fileKeys, answers);
        if (state.cursor.setIdx < state.setOrder.length - 1) {
            state.cursor.setIdx += 1;
            state.cursor.stage = "intent";   // 다음 세트는 의도 페이지부터
            saveState();
            window.scrollTo(0, 0);
            render();
        } else {
            state.finished = true;
            saveState();
            location.href = "final.html";
        }
    });
}

function pauseAll(fileKeys) {
    for (const fk of fileKeys) document.getElementById(`player-${fk}`)?.pause();
}

function buildRows(set, fileKeys, answers) {
    return fileKeys.map((fk, i) => ({
        participant_id: state.participant.id,
        participant_name: state.participant.name,
        set_id: set.set_id,
        condition: set.videos[fk],
        file_key: fk,
        set_index: state.cursor.setIdx,
        video_index: i,
        watch_seconds: Math.round((answers[fk].watch_seconds || 0) * 10) / 10,
        q1: answers[fk].q1, q2: answers[fk].q2, q3: answers[fk].q3,
    }));
}

async function uploadSet(set, fileKeys, answers) {
    const rows = buildRows(set, fileKeys, answers);
    if (!supabaseClient) {
        queuePending(rows);
        return;
    }
    // anon RLS allows insert and update but not upsert (needs select),
    // so insert the first time and update on revisits.
    try {
        if (!state.uploadedSets) state.uploadedSets = {};
        if (state.uploadedSets[set.set_id]) {
            await updateRows(rows);
        } else {
            const { error } = await supabaseClient.from("responses").insert(rows);
            if (error) {
                if (error.code === "23505") await updateRows(rows); // already inserted earlier
                else throw error;
            }
            state.uploadedSets[set.set_id] = true;
        }
        saveState();
    } catch (e) {
        console.warn("upload failed, queued", e);
        queuePending(rows);
    }
}

async function updateRows(rows) {
    for (const r of rows) {
        const { error } = await supabaseClient.from("responses").update(r)
            .eq("participant_id", r.participant_id)
            .eq("set_id", r.set_id)
            .eq("file_key", r.file_key);
        if (error) throw error;
    }
}

function queuePending(rows) {
    // replace any older queued rows for the same videos (answers may have been edited)
    state.pendingUploads = (state.pendingUploads || []).filter(p =>
        !rows.some(r => r.set_id === p.set_id && r.file_key === p.file_key));
    state.pendingUploads.push(...rows);
    saveState();
}

fetch("manifest.json").then(r => r.json()).then(m => { manifest = m; render(); });
</script>
</body>
</html>
